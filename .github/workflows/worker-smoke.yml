name: Worker smoke tests
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ./worker}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npx wrangler dev --local --port 8787 &
      - run: |
          sleep 5
          curl -f http://localhost:8787/ || echo "Skip: worker may not have root endpoint"
